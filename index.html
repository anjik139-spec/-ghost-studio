<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Меню бота</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --card: var(--tg-theme-secondary-bg-color, #1e293b);
      --text: var(--tg-theme-text-color, #f8fafc);
      --muted: var(--tg-theme-hint-color, #94a3b8);
      --accent: var(--tg-theme-button-color, #38bdf8);
      --accent-text: var(--tg-theme-button-text-color, #082f49);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
      font-family: system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(900px 500px at 10% 0%, rgba(56,189,248,.18), transparent 60%),
        radial-gradient(700px 500px at 100% 100%, rgba(168,85,247,.16), transparent 60%),
        var(--bg);
      color: var(--text);
    }

    .wrap { max-width: 720px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: 24px; }

    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(56,189,248,.16);
      color: var(--accent);
      border: 1px solid rgba(56,189,248,.35);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      appearance: none;
      border: 1px solid rgba(255,255,255,.1);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius: 18px;
      padding: 18px;
      text-align: left;
      color: var(--text);
      font: inherit;
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease;
    }

    .card:active { transform: scale(.97); border-color: var(--accent); }

    .card .icon { font-size: 28px; }
    .card .title { font-weight: 700; font-size: 17px; margin-top: 10px; }
    .card .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .wide { grid-column: 1 / -1; min-height: 96px; }

    .balance {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
    }

    .balance strong { display: flex; align-items: center; gap: 6px; font-size: 22px; }
    .balance span { color: var(--muted); font-size: 13px; }
    .ghost-coin {
      width: 1.65em;
      height: 1.65em;
      flex: none;
      filter: drop-shadow(0 3px 6px rgba(56,189,248,.45));
    }

    footer {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 420px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Меню</h1>
      <span class="badge" id="proBadge">FREE</span>
    </header>

    <div class="grid">
      <button class="card" data-action="photo">
        <span class="icon">🖼</span>
        <span>
          <span class="title">Создать фото</span>
          <span class="hint">По описанию или референсу</span>
        </span>
      </button>

      <button class="card" data-action="video">
        <span class="icon">🎬</span>
        <span>
          <span class="title">Создать видео</span>
          <span class="hint">Короткий клип</span>
        </span>
      </button>

      <button class="card" data-action="song">
        <span class="icon">🎵</span>
        <span>
          <span class="title">Создать песню</span>
          <span class="hint">Текст и стиль</span>
        </span>
      </button>

      <button class="card" data-action="templates">
        <span class="icon">📄</span>
        <span>
          <span class="title">Шаблоны</span>
          <span class="hint">Заявление, отчёт, договор</span>
        </span>
      </button>

      <button class="card wide" data-action="chat">
        <span class="icon">💬</span>
        <span>
          <span class="title">Открыть чат</span>
          <span class="hint">Вернуться к боту</span>
        </span>
      </button>
    </div>

    <div class="balance">
      <div>
        <span>Баланс</span>
        <strong>
          <span id="balanceValue">0</span>
          <svg class="ghost-coin" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="ghostBody" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#7dd3fc"/>
                <stop offset="0.5" stop-color="#5eead4"/>
                <stop offset="1" stop-color="#a78bfa"/>
              </linearGradient>
              <radialGradient id="ghostGlow" cx="0" cy="0" r="1" gradientTransform="translate(23 18) rotate(45) scale(30)">
                <stop stop-color="#ffffff" stop-opacity=".9"/>
                <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <path d="M32 5C18.7 5 11 14.2 11 27v25.5c0 2.4 2.7 3.8 4.7 2.4l4.6-3.2 4.4 3.7c1 .9 2.5.9 3.5 0l4.3-3.7 4.3 3.7c1 .9 2.5.9 3.5 0l4.4-3.7 4.6 3.2c2 1.4 4.7 0 4.7-2.4V27C53 14.2 45.3 5 32 5Z" fill="url(#ghostBody)"/>
            <path d="M32 5C18.7 5 11 14.2 11 27v5.5C17 20 26 14 38 14c6 0 10.8 2 15 6V27C53 14.2 45.3 5 32 5Z" fill="url(#ghostGlow)" opacity=".8"/>
            <ellipse cx="24.5" cy="28" rx="3.4" ry="5" fill="#0f172a"/>
            <ellipse cx="39.5" cy="28" rx="3.4" ry="5" fill="#0f172a"/>
            <circle cx="25.7" cy="26.3" r="1.2" fill="#fff"/>
            <circle cx="40.7" cy="26.3" r="1.2" fill="#fff"/>
            <path d="M27.5 39.5c2.8 3.2 6.2 3.2 9 0" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M52 10l1.4 4.2L57.6 16l-4.2 1.4L52 21.6l-1.4-4.2L46.4 16l4.2-1.8L52 10Z" fill="#fde68a"/>
          </svg>
        </strong>
      </div>
      <button class="badge" id="proButton" data-action="buy_pro">Купить PRO</button>
    </div>

    <footer>Меню работает внутри Telegram</footer>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  function send(action) {
    tg.sendData(JSON.stringify({ action }));
    tg.close();
  }

  document.querySelectorAll('[data-action]').forEach((el) => {
    el.addEventListener('click', () => {
      const action = el.dataset.action;
      if (action === 'chat') {
        tg.close();
        return;
      }
      send(action);
    });
  });

  async function loadMe() {
    try {
      const response = await fetch('/api/me', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ initData: tg.initData })
      });
      if (!response.ok) return;
      const me = await response.json();

      const proButton = document.getElementById('proButton');
      const proBadge = document.getElementById('proBadge');
      const balance = document.getElementById('balanceValue');

      if (me.pro) {
        proButton.textContent = 'PRO ✓';
        proButton.disabled = true;
        proBadge.textContent = 'PRO ✓';
      }

      if (typeof me.balance === 'number') {
        balance.textContent = String(me.balance);
      }
    } catch (error) {
      // Страница меню работает и без backend.
    }
  }

  loadMe();
</script>
</body>
</html>
